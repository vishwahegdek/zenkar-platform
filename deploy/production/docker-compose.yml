name: zenkar_platform_production

services:
  backend:
    image: vishwahegdek/zenkar-backend:production
    container_name: zenkar-backend-prod
    restart: always
    ports:
      - "3001:3000"
    depends_on:
      - db
    env_file: ../../.env
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/order_book?schema=public"
    networks:
      - zenkar-network

  frontend:
    image: vishwahegdek/zenkar-frontend:production
    container_name: zenkar-frontend-prod
    restart: always
    ports:
      - "5174:5173"
    depends_on:
      - backend
    networks:
      - zenkar-network

  db:
    image: postgres:15-alpine
    container_name: zenkar-db-prod
    restart: always
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=order_book
    volumes:
      - zenkar_db_data_prod_v3:/var/lib/postgresql/data
    networks:
      - zenkar-network

volumes:
  zenkar_db_data_prod_v3:
    name: zenkar_platform_production_zenkar_db_data_prod_v3

networks:
  zenkar-network:
    name: zenkar_platform_production_zenkar-network
    driver: bridge
